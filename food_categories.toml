[[category]]
name = "pasta"
keywords = [
    "pasta", "spaghetti", "penne", "rotini", "tortellini", "gnocchi",
    "linguine", "fettuccine", "lasagna",
]

[[category]]
name = "noodles"
keywords = ["noodle", "lo mein", "chow mein", "chow fun"]

[[category]]
name = "fried rice"
keywords = ["fried rice"]

[[category]]
name = "rice"
keywords = ["rice", "risotto"]

[[category]]
name = "mashed potatoes"
