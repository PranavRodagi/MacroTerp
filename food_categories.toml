[[category]]
name = "fries"
keywords = ["fries"]

[[category]]
name = "whole potatoes"
keywords = ["potato", "potaoes", "hash"]

# ---------------------------------------------------------------------------
# Sauces, dressings, and condiments
# ---------------------------------------------------------------------------
[[category]]
name = "salad dressing"
keywords = [
    "dressing", "vinaigrette", "vinagrette", "ff italian", "italian creamy",
    "farm house", "thousand island",
]

[[category]]
name = "sauce"
# Sauce words only count when they name the item (at the end, or a leading
# "Sauce"/"Salsa"), so "Tortellini with Cream Sauce" stays pasta.
patterns = [
    '\b(sauce|gravy|aioli|mayonnaise|mustard|salsa|pico de gallo|chutney|tzatziki|queso|syrup|marinara)( (roja|verde|blanco|plum))?$',
    '^(sauce|salsa)\b',
]
exclude = ["in syrup"]

[[category]]
name = "dip"
keywords = ["hummus", "guacamole"]

[[category]]
name = "condiment"
keywords = ["butter", "margarine", "spread", "olive oil", "vinegar", "cream cheese"]
exclude = ["butter chicken", "butter sage", "butter glazed", "butter pickles"]

