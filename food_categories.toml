# Generic food categories used by meal_recommender.py.
#
# Each [[category]] maps menu items to a broad generic name by matching the
# item's NAME (never its ingredients). Categories are checked top to bottom and
# the first match wins, so put specific dishes above the ingredients they
# contain (e.g. "pizza" above "cheese", "sandwich" above "bread").
#
# Fields:
#   name      Generic name shown in output (required, unique).
#   keywords  Words or phrases matched as whole words, case-insensitive. An
#             optional trailing "s"/"es" is allowed, so "pancake" also matches
#             "pancakes". List irregular plurals explicitly ("cherries").
#   patterns  Regular expressions for cases keywords can't express. Use
#             single-quoted strings so backslashes need no escaping.
#   exclude   Keywords that disqualify this category for an item, letting it
#             fall through to a later category (e.g. "Pancake Syrup" is not
#             pancakes).
#   meat      true for meat/fish categories. Items the dining hall tags vegan
#             or vegetarian that match one become "plant-based <name>", and
#             this check runs before normal ordering, so "Vegan Chicken Slider"
#             is "plant-based chicken" rather than "burger".
#
# Each category needs at least one keyword or pattern. Removing a category is
# safe: its items fall through to the next matching category. Items that match
# nothing are named "unknown" and are left out of generated meals.

# ---------------------------------------------------------------------------
# Composite dishes
# ---------------------------------------------------------------------------
[[category]]
name = "pizza"
keywords = ["pizza"]

[[category]]
name = "egg roll"
keywords = ["egg roll"]

[[category]]
name = "breakfast sandwich"
keywords = ["breakfast sandwich", "breakfast wrap", "breakfast bagel sandwich"]

[[category]]
name = "mac and cheese"
keywords = ["mac and cheese", "mac & cheese", "macaroni and cheese", "macaroni bake"]

[[category]]
name = "soup"
keywords = ["soup", "congee", "chowder", "bisque"]

[[category]]
name = "chili"
keywords = ["chili with beans", "chili con carne"]

[[category]]
name = "pot pie"
keywords = ["pot pie"]

[[category]]
name = "stir fry"
keywords = ["stir fry"]
exclude = ["sauce"]

[[category]]
name = "smoothie"
keywords = ["smoothie"]

[[category]]
name = "pickles"
keywords = ["pickle", "pickled", "kimchi"]

[[category]]
name = "pancakes and waffles"
keywords = ["pancake", "waffle", "french toast"]
exclude = ["syrup"]

# ---------------------------------------------------------------------------
# Desserts, baked goods, breakfast, and dairy
# ---------------------------------------------------------------------------
[[category]]
name = "dessert"
keywords = [
    "cheesecake", "brownie", "cobbler", "cookie", "ice cream", "soft serve",
    "sorbet", "pudding", "kheer", "sprinkles", "chocolate chips", "m&m pieces",
    "oreo pieces", "whipped cream", "hot fudge", "strawberry topping",
    "apple filling",
]
exclude = ["corn pudding"]

[[category]]
name = "pastry"
keywords = ["muffin", "donut", "croissant", "biscuit"]
exclude = ["english muffin"]

[[category]]
name = "cereal"
keywords = ["cereal", "granola", "coco puffs", "special k"]

[[category]]
name = "milk"
keywords = ["milk", "oatmilk"]

[[category]]
name = "yogurt"
keywords = ["yogurt"]

# ---------------------------------------------------------------------------
# Sandwiches and handhelds
# ---------------------------------------------------------------------------
[[category]]
name = "quesadilla"
keywords = ["quesadilla"]

[[category]]
name = "wrap"
keywords = ["wrap", "lavash", "shawarma flat bread"]

[[category]]
name = "sandwich"
keywords = ["sandwich", "panini", "sub", "grilled cheese", "cheese steak", "cheesesteak"]

[[category]]
name = "burger"
