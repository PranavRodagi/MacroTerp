# Generic food categories used by meal_recommender.py.
#
# Built from every item name on the full UMD menus (all three halls), so the
# keywords reflect how UMD actually names dishes. Each category is one image
# tag in the app; a few categories share a picture (noted next to the name).
#
# Each [[category]] maps menu items to a generic name by matching the item's
# NAME (never its ingredients). Categories are checked top to bottom and the
# first match wins, so dishes come before the ingredients they contain
# ("pizza" before "sausage", "pasta" before "lentils", "soup" before "chicken").
#
# Fields:
#   name      Generic name shown in output (required, unique).
#   keywords  Whole words or phrases, case-insensitive. A trailing "s"/"es" is
#             allowed automatically, so "pancake" also matches "pancakes".
#             List irregular plurals explicitly ("cherries").
#   patterns  Regular expressions for cases keywords can't express. Use
#             single-quoted strings so backslashes need no escaping.
#   exclude   Keywords that disqualify this category for an item, so it falls
#             through to a later category (e.g. "Pancake Syrup" is not pancakes).
#   meat      true for meat/fish categories. Items UMD tags vegan or vegetarian
#             that match one become "plant-based <name>" (shown with the same
#             image), and this check runs before normal ordering.
#
# Items that match nothing are named "unknown" and left out of generated meals.
# That is intentional for sauces, dressings, cheeses, breads, toppings and
# condiments, which shouldn't be suggested as part of a meal.

# ---------------------------------------------------------------------------
# Composite dishes (must come before the ingredients they contain)
# ---------------------------------------------------------------------------
[[category]]
name = "soup"
keywords = ["soup", "congee", "chowder", "bisque", "minestrone"]

[[category]]
name = "pizza"
keywords = ["pizza"]

[[category]]
name = "quesadilla"
keywords = ["quesadilla"]

[[category]]
name = "wrap"
keywords = ["wrap", "lavash", "shawarma"]

[[category]]
name = "sandwich"
keywords = ["sandwich", "panini", "sub", "grilled cheese", "cheese steak", "cheesesteak"]

[[category]]
name = "burger"
keywords = ["burger", "cheeseburger", "slider"]
exclude = ["bun", "roll"]

[[category]]
name = "hot dog"
keywords = ["hot dog"]
exclude = ["roll", "bun"]

[[category]]
name = "mac and cheese"
keywords = ["mac and cheese", "mac & cheese", "macaroni"]

# ---------------------------------------------------------------------------
# Breakfast and sweets
# ---------------------------------------------------------------------------
[[category]]
name = "french toast"
keywords = ["french toast"]
exclude = ["syrup"]

[[category]]
name = "pancakes"
keywords = ["pancake"]
exclude = ["syrup"]

[[category]]
name = "waffles"
keywords = ["waffle"]
exclude = ["syrup"]

[[category]]
name = "cereal"
keywords = ["cereal", "granola", "oatmeal", "grits", "coco puffs", "special k", "cinnamon berry quinoa"]
exclude = ["cookie"]

[[category]]
name = "yogurt"
keywords = ["yogurt"]

[[category]]
name = "muffin"
keywords = ["muffin"]
exclude = ["english muffin"]

[[category]]
name = "cookie"
keywords = ["cookie"]

[[category]]
name = "ice cream"
keywords = ["ice cream", "soft serve", "sorbet"]

# ---------------------------------------------------------------------------
# Starches (before proteins, so "Rotini Chickpea Pasta" is pasta and
# "Garlic Lentils Rosemary Roasted Potatoes" is potatoes)
# ---------------------------------------------------------------------------
[[category]]
name = "noodles"   # image: spaghetti
keywords = ["noodle", "lo mein", "chow mein", "chow fun"]

[[category]]
name = "pasta"     # image: spaghetti
keywords = [
    "pasta", "spaghetti", "penne", "rotini", "tortellini", "gnocchi",
    "linguine", "fettuccine", "lasagna", "ziti",
]

[[category]]
name = "rice"
keywords = ["rice", "risotto", "pilaf"]
exclude = ["kheer"]

[[category]]
name = "fries"
keywords = ["fries"]
patterns = ['^FF\b']   # UMD shorthand, e.g. "FF Italian"

[[category]]
name = "mashed potatoes"
keywords = ["mashed potato"]

[[category]]
name = "roasted potatoes"
keywords = ["potato", "potaoes", "hash"]
exclude = ["chip", "roll", "bun"]

# ---------------------------------------------------------------------------
# Proteins
# ---------------------------------------------------------------------------
[[category]]
name = "shrimp"
keywords = ["shrimp"]
meat = true

[[category]]
name = "fish"      # image: salmon
keywords = ["fish", "catfish", "tilapia", "cod", "pollock", "tuna", "salmon"]
meat = true

[[category]]
name = "sausage"
keywords = ["sausage"]
meat = true

[[category]]
name = "bacon"
keywords = ["bacon"]
exclude = ["bits"]
meat = true

[[category]]
name = "chicken"
keywords = ["chicken"]
exclude = ["gravy"]
meat = true

[[category]]
name = "turkey"
keywords = ["turkey"]
exclude = ["collard"]
meat = true

[[category]]
name = "beef"
keywords = ["beef", "brisket", "steak"]
meat = true

[[category]]
name = "pork"
keywords = ["pork", "ham", "salami", "pepperoni", "adobo"]
meat = true

[[category]]
name = "tofu"
keywords = ["tofu"]

[[category]]
name = "eggs"
keywords = ["egg", "egg white"]
exclude = ["egg roll"]

[[category]]
name = "chickpeas"
keywords = ["chickpea", "garbanzo", "chana"]

[[category]]
name = "lentils"   # image: chickpeas
keywords = ["lentil"]

[[category]]
name = "green beans"
keywords = ["green bean"]

[[category]]
name = "beans"     # image: chickpeas
keywords = ["bean", "edamame"]
exclude = ["sprout"]

# ---------------------------------------------------------------------------
# Vegetables and fruit
# ---------------------------------------------------------------------------
[[category]]
name = "broccoli"
keywords = ["broccoli"]

[[category]]
name = "brussels sprouts"
keywords = ["brussels sprout", "brussel sprout"]

[[category]]
name = "cauliflower"
keywords = ["cauliflower"]

[[category]]
name = "carrots"
keywords = ["carrot"]

[[category]]
name = "corn"
keywords = ["corn", "hominy"]
exclude = ["nuts", "tostada"]

[[category]]
name = "salad"
keywords = [
    "salad", "slaw", "lettuce", "romaine", "spring mix", "kale", "arugula",
    "spinach", "cabbage", "cucumber",
]
exclude = ["smoothie", "tortilla", "squash"]

[[category]]
name = "mixed vegetables"
keywords = [
    "vegetable", "veggies", "squash", "zucchini", "parsnip", "mushroom",
    "pea", "sugar snap pea", "bok choy", "collard green", "beet", "shishito",
    "grilled peppers", "stir fry", "kimchi",
]
exclude = ["milk", "sauce"]

[[category]]
name = "fruit"
keywords = [
    "fruit", "apple", "banana", "orange", "grapefruit", "grape", "blueberry",
    "strawberry", "cantaloupe", "melon", "watermelon", "pineapple", "kiwi",
    "peach", "pear", "mango", "cherries", "raisin",
]
exclude = [
    "filling", "cobbler", "biscuit", "cheesecake", "topping", "sauce",
    "pudding", "jacks", "pepper", "tomato",
]